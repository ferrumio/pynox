[project]
name = "pynox-dev"
version = "0.1.0"
description = "Development tools for the Pynox Rust runtime"
requires-python = ">=3.11,<3.16"

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest==9.0.3", "ruff==0.14.13", "patchelf==0.17.2.4; sys_platform == 'linux'", "pyyaml==6.0.3"]
docs = ["zensical==0.0.16"]
integration = ["pydantic==2.14.1", "aws-lambda-powertools==3.36.0", "pydantic-monty==1.1.0"]
# Agent frameworks for examples/agents/. glibc only: some dependencies have no musl wheels.
agents = ["pydantic-ai-slim[bedrock]==2.57.0", "strands-agents==1.61.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
