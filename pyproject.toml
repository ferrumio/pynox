[project]
name = "pynox-dev"
version = "0.1.0"
description = "Development tools for the Pynox Rust runtime"
requires-python = ">=3.11,<3.16"

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.6", "patchelf==0.19.3.0; sys_platform == 'linux'", "pyyaml==6.0.4"]
docs = ["zensical==0.1.3"]
integration = ["pydantic==2.14.4", "aws-lambda-powertools==3.41.0", "pydantic-monty==1.7.0"]
# Agent frameworks for examples/agents/. glibc only: some dependencies have no musl wheels.
agents = ["pydantic-ai-slim[bedrock]==2.74.0", "strands-agents==1.66.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
